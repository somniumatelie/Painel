<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Somnium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Painel Somnium Ateliê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8F2;--card:#F4EFE6;--lil:#EFE9F5;--rox:#7A5FA0;--tx:#2F2A35;--mut:#6D6476;--line:#E8E0D4;--gold:#8C6B2E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Jost',system-ui,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.tela{padding:28px 22px 170px;position:relative;overflow:hidden}
.tela.form{padding-bottom:130px}
.hd{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}.hd.rel,.rel{position:relative}
.sub{font-size:14px;color:var(--mut)}
.tit{font-family:'Kaushan Script',cursive;font-size:34px;line-height:1.2;margin:0 0 6px}
.tit.big{font-size:40px}
.marca{position:absolute;right:-28px;top:6px;width:340px;height:340px;opacity:.1;pointer-events:none}
.frase{margin:10px 0 90px;font-size:15px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:20px;background:var(--card);height:100px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.ic{width:38px;height:38px;border-radius:19px;background:var(--lil);display:flex;align-items:center;justify-content:center;flex:none}
.tt{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}.tt b{font-size:16px;font-weight:500}.tt small{font-size:12px;color:var(--mut)}
.aviso{margin-top:16px;border:0;background:transparent;display:flex;align-items:center;gap:10px;color:var(--gold);font-size:14px;padding:4px 0;text-align:left}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.nav button{border:0;background:transparent;color:var(--mut);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button.on{color:var(--rox);font-weight:600}
.fab{position:fixed;right:max(22px,calc(50% - 238px));bottom:calc(94px + env(safe-area-inset-bottom));height:52px;padding:0 20px;border:0;border-radius:26px;background:var(--rox);color:#fff;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(122,95,160,.3);z-index:4}
.chips{margin:14px 0 4px;display:flex;gap:8px;overflow-x:auto}.chips.wrap{flex-wrap:wrap;overflow:visible;margin-top:6px}
.chip{border:0;height:40px;padding:0 16px;border-radius:20px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--rox);color:#fff}
.lista{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.card{border:0;width:100%;border-radius:18px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.card.row{flex-direction:row;align-items:center;gap:12px}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mut{color:var(--mut);font-size:13px;background:none;border:0}.sm{font-size:12px}
.pill{font-size:12px;font-weight:500;padding:3px 10px;border-radius:10px}
.pill.lil{background:var(--lil);color:#5B4580}.pill.gold{background:#F3E9D2;color:#6B5120}.pill.ok{background:#E3EDE3;color:#2F5A3A}
.vazio{color:var(--mut);font-size:14px;line-height:1.4;margin:22px 0}
.sec2{margin:20px 0 8px;font-size:16px;font-weight:500}.sec{margin:18px 0 10px}
.back{border:0;background:transparent;padding:0;height:44px;display:flex;align-items:center;gap:4px;color:var(--rox);font-size:14px;font-weight:500}
.lb{display:block;margin-top:14px;font-size:13px;color:var(--mut)}
.in{display:block;width:100%;margin-top:6px;height:46px;border:0;border-radius:14px;background:var(--card);padding:0 14px;font-family:inherit;font-size:16px;color:var(--tx)}
.in.ta{height:auto;padding:12px 14px;resize:vertical}.busca{margin-top:14px;border-radius:23px;height:46px;padding:0 18px}
select.in{appearance:none}
.in:focus{outline:2px solid var(--rox);outline-offset:1px}
.barra{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding:12px 22px calc(18px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:6;align-items:center}
.btn{flex:1;min-height:50px;border:0;border-radius:25px;background:var(--rox);color:#fff;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 18px}
.btn.sec{background:var(--lil);color:#5B4580}.btn.gold{background:#6B5120;color:#fff;min-height:42px;font-size:14px}
.duo{display:flex;gap:10px;margin-top:14px}.duo2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.med{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mm{display:flex;justify-content:space-between;align-items:center;border-radius:14px;background:var(--card);padding:4px 6px 4px 12px;font-size:14px;color:var(--mut);gap:8px}
.mm .in{margin:0;width:70px;height:38px;text-align:right;background:#fff;font-weight:600}
.av{width:42px;height:42px;border-radius:21px;background:var(--lil);color:var(--rox);font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.th{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:var(--lil);display:flex;align-items:center;justify-content:center}
.fotos{display:flex;gap:10px;margin:10px 0;overflow-x:auto}.ft{position:relative;flex:none}.ft img{width:92px;height:92px;border-radius:18px;object-fit:cover;display:block}
.ft .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;background:rgba(47,42,53,.7)}
.addf{flex:none;width:92px;height:92px;border-radius:18px;border:1px dashed #B9AFC6;background:transparent;color:var(--rox);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500}
.x{border:0;background:transparent;padding:4px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.rowh{display:flex;justify-content:space-between;align-items:center}.lk{display:flex;gap:14px}.lk button{border:0;background:none;color:var(--rox);font-size:13px;font-weight:500}
.mat{margin-top:8px;border-radius:14px;background:var(--card);padding:10px}.mh{display:flex;gap:6px;align-items:center}.mh .in{margin:0;background:#fff;height:40px}
.tri{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:8px;font-size:11px;color:var(--mut)}.tri .in{background:#fff;height:40px;margin-top:3px;padding:0 10px}
.calc{border-radius:20px;background:var(--lil);padding:16px;display:flex;flex-direction:column;gap:8px}
.cl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}.cl span:last-child{white-space:nowrap}.cl.bold{color:var(--tx);font-weight:600;font-size:16px}.calc hr{border:0;height:1px;background:#D9CFE3;width:100%;margin:0}
.tri2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:11px;color:var(--mut)}.tri2.q4{grid-template-columns:1fr 1fr}.tri2 .in{background:#fff;height:40px;margin-top:3px;padding:0 10px}.sm2{background:#fff;height:40px;margin-top:8px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.sw span{display:flex;flex-direction:column}.sw small{font-size:12px;color:var(--mut)}.sw input{width:22px;height:22px;accent-color:var(--rox)}
.sem{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.sem button{border:0;background:none;color:var(--rox);height:36px;padding:0 8px;display:flex;align-items:center}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{border:0;border-radius:16px;height:64px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.dia small{font-size:12px;font-weight:500}.dia b{font-size:18px}.dia.on{background:var(--rox);color:#fff}
.dia i{width:5px;height:5px;border-radius:3px;display:block;margin-top:1px}.dia i.pt{background:#C9A66B}
.slot{display:flex;gap:12px;margin-top:10px;align-items:stretch}.hr{width:34px;font-size:13px;color:var(--mut);padding-top:12px}.sl{flex:1;display:flex;flex-direction:column;gap:6px}
.livre{border:1px dashed #D9CFE3;background:transparent;border-radius:16px;min-height:52px;color:var(--mut);font-size:13px;text-align:left;padding:0 14px}
.tarefa{display:flex;align-items:center;gap:10px;border-radius:16px;background:var(--lil);padding:8px 12px;min-height:52px}.tarefa.feito{opacity:.55}.tarefa.feito b{text-decoration:line-through}
.cx{width:26px;height:26px;border-radius:13px;border:1.5px solid #B9AFC6;background:transparent;flex:none;display:flex;align-items:center;justify-content:center}
.tx{border:0;background:none;text-align:left;flex:1;display:flex;flex-direction:column;gap:1px;padding:4px 0}.tx small{color:var(--mut);font-size:12px}
.agd .tarefa{margin-top:8px}
.num{border-radius:18px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:2px;margin-top:14px}.num small{font-size:12px;color:var(--mut)}.num b{font-size:20px}
.alerta{margin-top:14px;border-radius:20px;background:#F3E9D2;color:#6B5120;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.35}.alerta>svg{flex:none}.am{margin-bottom:4px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center}
.login .btn{flex:none;width:100%;max-width:320px}.err{color:#B3261E;font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(47,42,53,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}.mc{background:var(--bg);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 22px 30px;display:flex;flex-direction:column;gap:8px}
</style>
<style id="home2">.vit{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:2px 22px 8px;scroll-padding:0 22px;scrollbar-width:none}.vit::-webkit-scrollbar{display:none}
.vc{flex:0 0 138px;scroll-snap-align:start;border:0;background:var(--card);border-radius:20px;padding:6px 6px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.vc img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:15px;background:#eee7dc;margin-bottom:6px}.vc b{font-size:14px;font-weight:500;padding:0 6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vc span{font-size:14px;padding:0 6px;color:#7A5FA0;font-weight:600}
.nums{background:#3A3541;color:#fff;border-radius:24px;padding:18px}.nm1 small{color:#cfc5d8;font-size:13px;display:block}.nm1 b{display:block;font-size:34px;font-weight:600;color:#E9D3A6;margin:2px 0 14px;white-space:nowrap}
.nm3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nm{background:rgba(255,255,255,.08);border-radius:14px;padding:10px}.nm b{display:block;font-size:22px;font-weight:600}.nm small{font-size:12px;color:#cfc5d8;line-height:1.2;display:block}
.bars{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:16px}.br{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.br i{display:block;width:100%;border-radius:6px;background:rgba(233,211,166,.35)}.br i.on{background:#E9D3A6}.br small{font-size:11px;color:#cfc5d8;text-transform:capitalize}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createStore } from './store.js';
import { boot } from './app.js';
boot(createStore());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
